<!DOCTYPE html>
<html>
<head>
    <title>AR Doraemon Kartun Pasti Muncul</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin : 0px; overflow: hidden;">

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <!-- Marker HIRO -->
        <a-marker preset="hiro">
            
            <!-- Menggunakan komponen <a-image> untuk memuat gambar Doraemon berformat PNG transparan -->
            <!-- Gambar ini akan otomatis selalu menghadap ke kamera (look-at) atau berputar lembut -->
            <a-image 
                src="https://images.uncyc.org/id/c/c3/Doraemon_karakter.png" 
                position="0 1 0" 
                width="1.5" 
                height="2"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
            </a-image>

            <!-- Opsional: Efek bayangan lingkaran di bawah Doraemon agar terlihat menapak -->
            <a-ellipse 
                position="0 0.01 0" 
                rotation="-90 0 0" 
                radius-x="0.6" 
                radius-y="0.4" 
                color="#333" 
                opacity="0.3">
            </a-ellipse>
            
        </a-marker>

        <a-entity camera></a-entity>
        
    </a-scene>
</body>
</html>
