<!DOCTYPE html>
<html>
<head>
    <title>AR Doraemon Fixed</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0px; overflow: hidden;">

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <a-entity light="type: ambient; color: #FFF; intensity: 1.5"></a-entity>
        <a-entity light="type: directional; color: #FFF; intensity: 1" position="-1 2 1"></a-entity>

        <a-marker preset="hiro">
            
            <a-entity 
                id="doraemon"
                gltf-model="url(https://arjs-cors-proxy.herokuapp.com/https://raw.githubusercontent.com/nethox/doraemon-3d/master/scene.gltf)"
                position="0 0 0" 
                scale="0.02 0.02 0.02"
                rotation="0 0 0"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">
            </a-entity>
            
        </a-marker>

        <a-entity camera></a-entity>
        
    </a-scene>
</body>
</html>
