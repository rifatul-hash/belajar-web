<!DOCTYPE html>
<html>
<head>
    <title>AR Bintang 3D Tanpa ARCore</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin : 0px; overflow: hidden;">

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <!-- Marker HIRO -->
        <a-marker preset="hiro">
            
            <!-- Entitas Induk untuk Animasi Berputar -->
            <a-entity position="0 0.8 0" 
                      animation="property: rotation; to: 360 360 0; loop: true; dur: 6000; easing: linear">
                
                <!-- Kerucut 1 (Menghadap ke Atas) -->
                <a-cone radius-bottom="0.4" 
                        radius-top="0" 
                        height="1.2" 
                        segments-radial="4"
                        material="color: #FFD700; metalness: 0.5; roughness: 0.2; opacity: 0.9;">
                </a-cone>
                
                <!-- Kerucut 2 (Menghadap ke Bawah) -->
                <a-cone radius-bottom="0.4" 
                        radius-top="0" 
                        height="1.2" 
                        segments-radial="4"
                        rotation="180 0 0"
                        material="color: #FFD700; metalness: 0.5; roughness: 0.2; opacity: 0.9;">
                </a-cone>

                <!-- Kerucut 3 (Menghadap ke Samping untuk menambah dimensi bintang) -->
                <a-cone radius-bottom="0.4" 
                        radius-top="0" 
                        height="1.2" 
                        segments-radial="4"
                        rotation="0 0 90"
                        material="color: #FFD700; metalness: 0.5; roughness: 0.2; opacity: 0.9;">
                </a-cone>
                
            </a-entity>
            
        </a-marker>

        <a-entity camera></a-entity>
        
    </a-scene>
</body>
</html>
