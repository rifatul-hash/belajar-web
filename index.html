<!DOCTYPE html>
<html>
<head>
    <title>AR Doraemon Tanpa ARCore</title>
    <!-- Menggunakan versi A-Frame yang sedikit lebih stabil untuk AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin : 0px; overflow: hidden;">

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <!-- Asset Management: Tempat meload model 3D agar lebih ringan -->
        <a-assets>
            <a-asset-item id="doraemon-model" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/BoomBox/glTF/BoomBox.gltf"></a-asset-item>
            <!-- Catatan: Ganti URL src di atas dengan URL model Doraemon .gltf/.glb Anda -->
        </a-assets>

        <!-- Menggunakan Marker HIRO -->
        <a-marker preset="hiro">
            
            <!-- Mengganti a-box menjadi entitas model 3D Doraemon -->
            <a-entity 
                id="doraemon"
                gltf-model="url(https://raw.githubusercontent.com/nethox/doraemon-3d/master/scene.gltf)"
                position="0 0 0" 
                scale="0.5 0.5 0.5"
                rotation="0 0 0"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">
            </a-entity>
            
        </a-marker>

        <a-entity camera></a-entity>
        
    </a-scene>
</body>
</html>
